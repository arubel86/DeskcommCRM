services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: deskcomm-app:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env
    depends_on:
      srh:
        condition: service_started
      waha:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal
      - coolify

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: deskcomm-worker:local
    pull_policy: never
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    environment:
      WAHA_API_BASE_URL: http://waha:3000
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:arm}
    restart: unless-stopped
    mem_limit: 1280m
    environment:
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"
      WHATSAPP_HOOK_URL: ${WAHA_WEBHOOK_BASE_URL}/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "${WHATSAPP_RESTART_ALL_SESSIONS:-True}"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - internal

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: deskcomm-scheduler:local
    pull_policy: never
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    networks:
      - internal

  caddy:
    profiles: ["caddy-disabled-on-coolify"]
    image: caddy:2-alpine

volumes:
  waha-data:
  waha-media:

networks:
  internal:
    driver: bridge
  coolify:
    external: true
